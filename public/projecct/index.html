<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tai lieu project</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #111827;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
      }

      .name {
        margin: 0;
        font-weight: 700;
      }

      .type {
        margin: 4px 0 0;
        color: #4b5563;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
      }

      .primary {
        background: #2563eb;
        color: #ffffff;
      }

      .secondary {
        border: 1px solid #9ca3af;
        color: #111827;
      }

      @media (max-width: 640px) {
        .item {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }

        .item {
          border-color: #374151;
          background: #1f2937;
        }

        .type {
          color: #d1d5db;
        }

        .secondary {
          border-color: #6b7280;
          color: #f9fafb;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tai lieu project</h1>
      <div class="grid">
        <section class="item">
          <div>
            <p class="name">MangMayTinhNangCao.docx</p>
            <p class="type">Tai lieu Word</p>
          </div>
          <div class="actions">
            <a class="primary" href="./MangMayTinhNangCao.html">Xem</a>
            <a class="secondary" href="./MangMayTinhNangCao.docx">Tai ve</a>
          </div>
        </section>
        <section class="item">
          <div>
            <p class="name">AnNinhMang.docx</p>
            <p class="type">Tai lieu Word</p>
          </div>
          <div class="actions">
            <a class="primary" href="./AnNinhMang.html">Xem</a>
            <a class="secondary" href="./AnNinhMang.docx">Tai ve</a>
          </div>
        </section>
        <section class="item">
          <div>
            <p class="name">ThietKeMang.pdf</p>
            <p class="type">Tai lieu PDF</p>
          </div>
          <div class="actions">
            <a class="primary" href="./ThietKeMang.html">Xem</a>
            <a class="secondary" href="./ThietKeMang.pdf">Tai ve</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
