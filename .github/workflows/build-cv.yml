name: Build CV PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/cv/cv.tex
      - .github/workflows/build-cv.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra

      - name: Build CV PDF
        working-directory: public/cv
        run: |
          pdflatex -interaction=nonstopmode cv.tex
          pdflatex -interaction=nonstopmode cv.tex

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv/cv.pdf
          git commit -m "Automated: rebuild CV PDF" || echo "No changes to commit"
          git push
